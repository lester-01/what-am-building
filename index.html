<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>What I am building</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f6f4ef;
      --fg: #1c1917;
      --muted: #57534e;
      --card: #fff;
      --line: #e7e5e4;
      --accent: #0f766e;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #1c1917;
        --fg: #f5f5f4;
        --muted: #a8a29e;
        --card: #292524;
        --line: #44403c;
        --accent: #5eead4;
      }
    }
    body {
      margin: 0 auto;
      max-width: 44rem;
      padding: 2rem 1.25rem 4rem;
      font: 16px/1.5 system-ui, sans-serif;
      background: var(--bg);
      color: var(--fg);
    }
    h1 { font-size: 1.6rem; margin: 0 0 0.35rem; }
    .lead, .empty, .stamp, .legend { color: var(--muted); }
    .stamp { font-size: 0.85rem; margin: 1.5rem 0 0; }
    .filters {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      margin: 1rem 0 0.25rem;
    }
    .filters button {
      min-height: 44px;
      min-width: 44px;
      padding: 0.45rem 0.9rem;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: var(--card);
      color: var(--fg);
      font: inherit;
    }
    .filters button[aria-pressed="true"] {
      border-color: var(--accent);
      color: var(--accent);
    }
    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 1rem 1.1rem;
      margin: 0.85rem 0;
    }
    .card h2 { font-size: 1.1rem; margin: 0 0 0.35rem; }
    .card a { color: var(--accent); }
    .meta { font-size: 0.9rem; color: var(--muted); }
    .vis {
      display: inline-block;
      font-size: 0.75rem;
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 0.15rem 0.5rem;
      text-transform: lowercase;
    }
    .tags { margin: 0.5rem 0 0; padding: 0; list-style: none; display: flex; flex-wrap: wrap; gap: 0.35rem; }
    .tags li {
      font-size: 0.75rem;
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 0.1rem 0.5rem;
    }
    .legend { font-size: 0.9rem; margin-top: 2.5rem; }
    .legend table { border-collapse: collapse; width: 100%; }
    .legend td, .legend th { text-align: left; padding: 0.25rem 0.4rem 0.25rem 0; }
    code { font-size: 0.9em; }
  </style>
</head>
<body>
  <h1>What I am building</h1>
  <p class="lead">Projects I chose to list. Public repos have a link. Private ones show a label only.</p>
  <div class="filters" role="group" aria-label="Visibility filter">
    <button type="button" data-filter="all" aria-pressed="true">All</button>
    <button type="button" data-filter="public" aria-pressed="false">Public</button>
    <button type="button" data-filter="private" aria-pressed="false">Private</button>
  </div>
  <div id="list"></div>
  <section class="legend">
    <h2>Status meanings</h2>
    <div id="legend"></div>
  </section>
  <p class="stamp" id="stamp"></p>
  <script>
    function el(tag, attrs, text) {
      const node = document.createElement(tag);
      Object.entries(attrs || {}).forEach(([k, v]) => node.setAttribute(k, v));
      if (text) node.textContent = text;
      return node;
    }
    function visOf(item) {
      return item.visibility || (item.private ? "private" : "public");
    }
    function cardFor(item) {
      const card = el("article", { class: "card" });
      const title = el("h2");
      if (item.html_url) {
        const a = el("a", { href: item.html_url }, item.name);
        title.appendChild(a);
      } else {
        title.textContent = item.name;
      }
      card.appendChild(title);
      if (item.description) card.appendChild(el("p", {}, item.description));
      const meta = el("p", { class: "meta" });
      meta.appendChild(document.createTextNode("Status: " + (item.status || "idea") + " · "));
      meta.appendChild(el("span", { class: "vis" }, visOf(item)));
      card.appendChild(meta);
      if (item.tags && item.tags.length) {
        const ul = el("ul", { class: "tags" });
        item.tags.forEach(t => ul.appendChild(el("li", {}, t)));
        card.appendChild(ul);
      }
      return card;
    }
    Promise.all([
      fetch("data/projects.json").then(r => r.json()),
      fetch("data/status.json").then(r => r.json())
    ]).then(([bundle, statuses]) => {
      const list = document.getElementById("list");
      const projects = bundle.projects || [];
      let filter = "all";
      function draw() {
        list.replaceChildren();
        const shown = projects.filter(item => filter === "all" || visOf(item) === filter);
        if (!shown.length) {
          list.appendChild(el("p", { class: "empty" }, "Nothing listed yet."));
          return;
        }
        shown.forEach(item => list.appendChild(cardFor(item)));
      }
      document.querySelectorAll(".filters button").forEach(btn => {
        btn.addEventListener("click", () => {
          filter = btn.getAttribute("data-filter") || "all";
          document.querySelectorAll(".filters button").forEach(other => {
            other.setAttribute("aria-pressed", other === btn ? "true" : "false");
          });
          draw();
        });
      });
      draw();
      const legend = document.getElementById("legend");
      const table = el("table");
      (statuses.statuses || []).forEach(row => {
        const tr = el("tr");
        tr.appendChild(el("td", {}, "")).appendChild(el("code", {}, row.id));
        tr.appendChild(el("td", {}, row.meaning));
        table.appendChild(tr);
      });
      legend.appendChild(table);
      if (bundle.generated_at) {
        document.getElementById("stamp").textContent = "Generated " + bundle.generated_at;
      }
    }).catch(() => {
      document.getElementById("list").appendChild(
        el("p", { class: "empty" }, "Could not load project data.")
      );
    });
  </script>
</body>
</html>
